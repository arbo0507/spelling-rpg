    <title>Spelling RPG - 聖言傳教士傳說 (Final Enhanced)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@700;900&display=swap');
        
        * { scrollbar-width: none; -ms-overflow-style: none; touch-action: manipulation; }
        *::-webkit-scrollbar { display: none; }

        body { 
            user-select: none; -webkit-user-select: none; background-color: #000; 
            margin: 0; padding: 0; height: 100dvh; width: 100vw; overflow: hidden;
            font-family: 'Noto Serif TC', serif;
        }

        .game-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; justify-content: center; align-items: center;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-4px, -4px); }
            20% { transform: translate(4px, 4px); }
            30% { transform: translate(-4px, 4px); }
            40% { transform: translate(4px, -4px); }
            100% { transform: translate(0, 0); }
        }
        .shake-active { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }

        .game-frame {
            width: 100%; height: 100dvh; max-width: 480px;
            background: #020617; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .font-rpg { font-family: 'Cinzel', 'Noto Serif TC', serif; }
        .rpg-panel { background: rgba(15, 23, 42, 0.95); border: 2px solid #475569; }
        .rpg-button { background: linear-gradient(to bottom, #78350f, #451a03); border: 2px solid #fbbf24; color: white; }
        
        .tactic-btn {
            position: relative; width: 60px; height: 60px;
            border-radius: 50%; border: 3px solid #475569;
            background: #0f172a; overflow: hidden;
            transition: all 0.2s; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .tactic-btn.active { border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.8); transform: scale(1.1); }
        .tactic-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

        .tactic-btn img { width: 100%; height: 100%; object-fit: cover; }
        
        .kbd-container { background: #1e293b; padding: 8px 4px 12px 4px; flex-shrink: 0; }
        .kbd-row { display: flex; justify-content: center; gap: 4px; width: 100%; margin-bottom: 4px; }
        .kbd-key { 
            flex: 1; height: 42px; max-width: 36px; 
            background: #f8fafc; color: #0f172a; 
            border-radius: 6px; font-weight: 900; 
            border-bottom: 4px solid #cbd5e1;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
        }
        .kbd-key:active { transform: translateY(2px); border-bottom-width: 1px; background: #fbbf24; }
        .row-2-spacer { width: 18px; } 
        .row-3-spacer { width: 40px; } 

        .skill-ready-glow { animation: skillGlow 1.5s infinite; background: #6b21a8 !important; border-color: #d8b4fe !important; box-shadow: 0 0 15px #a855f7 !important; }
        @keyframes skillGlow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }

        .locked-silhouette { filter: brightness(0) invert(0.2); opacity: 0.6; }

        .dmg-text { text-shadow: 1px 1px 0px #000; transition: color 0.3s; }
        .dmg-pop { animation: pop 0.2s ease-out; display: inline-block; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.5); color: #fbbf24; } 100% { transform: scale(1); } }
        
        .total-dmg-pop { animation: bigPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes bigPop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

        .new-badge { animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        .blizzard-blur { animation: blizzard 3s infinite; }
        @keyframes blizzard { 0%, 100% { filter: blur(0px); opacity: 1; } 50% { filter: blur(4px); opacity: 0.4; } 25%, 75% { filter: blur(1px); opacity: 0.8; } }

        .word-display-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            overflow-y: auto;
            min-height: 100px;
            position: relative;
        }
        
        .char-box {
            display: inline-flex;
            width: 24px;
            height: 40px;
            align-items: center;
            justify-content: center;
            margin: 0 2px;
            font-family: monospace;
            font-weight: 900;
            font-size: 28px;
            transition: all 0.1s;
            position: relative;
        }

        .char-typed-zoom { animation: charZoom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes charZoom { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }

        .curfew-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; text-align: center;
        }

        .rainbow-text {
            background: linear-gradient(to right, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            color: transparent;
            animation: rainbow 1s linear infinite;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            font-family: 'Cinzel', serif;
        }
        @keyframes rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

        /* Minecraft 經驗粒子 */
        .mc-exp-particle {
            width: 10px; height: 10px;
            background: #7CFC00;
            border: 2px solid #32CD32;
            box-shadow: 0 0 8px #7CFC00;
            position: absolute;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root" class="game-container"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { motion, AnimatePresence } = window.Motion || window.framerMotion;

        const Icons = {
            Lock: (p) => <Icon path='<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' {...p} />,
            MapIcon: (p) => <Icon path='<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>' {...p} />,
            HomeIcon: (p) => <Icon path='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' {...p} />,
            Music: (p) => <Icon path='<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>' {...p} />,
            Book: (p) => <Icon path='<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>' {...p} />,
            X: (p) => <Icon path='<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' {...p} />,
            Keyboard: (p) => <Icon path='<rect x="2" y="4" width="20" height="16" rx="2" ry="2"/><line x1="6" y1="8" x2="6" y2="8"/><line x1="10" y1="8" x2="10" y2="8"/><line x1="14" y1="8" x2="14" y2="8"/><line x1="18" y1="8" x2="18" y2="8"/><line x1="6" y1="12" x2="6" y2="12"/><line x1="10" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="14" y2="12"/><line x1="18" y1="12" x2="18" y2="12"/><line x1="7" y1="16" x2="17" y2="16"/>' {...p} />,
            Maximize: (p) => <Icon path='<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>' {...p} />,
            Minimize: (p) => <Icon path='<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>' {...p} />,
            ChevronLeft: (p) => <Icon path='<polyline points="15 18 9 12 15 6"/>' {...p} />,
            ChevronRight: (p) => <Icon path='<polyline points="9 18 15 12 9 6"/>' {...p} />,
            Star: (p) => <Icon path='<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' {...p} />,
        };

        const Icon = ({ path, className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: path}} />
        );

        // 粒子組件 (支援流向角色的經驗粒子)
        const Particle = ({ x, y, color, type = 'normal', targetX, targetY }) => {
            if (type === 'exp') {
                const scatterX = x + (Math.random() - 0.5) * 120;
                const scatterY = y + (Math.random() - 0.5) * 120;
                return (
                    <motion.div
                        initial={{ x, y, opacity: 1, scale: 1 }}
                        animate={{ 
                            x: [x, scatterX, targetX], 
                            y: [y, scatterY, targetY], 
                            opacity: [1, 1, 0],
                            scale: [1, 1.2, 0.5]
                        }}
                        transition={{ duration: 1.2, times: [0, 0.2, 1], ease: "easeInOut" }}
                        className="mc-exp-particle"
                    />
                );
            }
            const angle = Math.random() * Math.PI * 2;
            const distance = 40 + Math.random() * 60;
            return (
                <motion.div
                    initial={{ x, y, opacity: 1, scale: 1 }}
                    animate={{ x: x + Math.cos(angle) * distance, y: y + Math.sin(angle) * distance, opacity: 0, scale: 0 }}
                    transition={{ duration: 0.6, ease: "easeOut" }}
                    className="absolute w-2 h-2 rounded-full pointer-events-none z-[60]"
                    style={{ backgroundColor: color }}
                />
            );
        };

        const ASSETS = {
            bg_start: "./assets/bg_start.jpg", bg_home: "./assets/bg_home.jpg", bg_map: "./assets/bg_map.jpg", 
            bg_waterfall: "./assets/bg_waterfall.jpg", bg_grass: "./assets/bg_grass.jpg", bg_ice: "./assets/bg_ice.jpg", bg_fire: "./assets/bg_fire.jpg", bg_church: "./assets/bg_church.jpg", bg_final: "./assets/bg_final.jpg",
            char_missionary: "./assets/char_missionary.png", btn_tactic_a: "./assets/btn_tactic_a.png", btn_tactic_b: "./assets/btn_tactic_b.png",
            btn_skill_shield: "./assets/btn_skill_shield.png", btn_skill_water: "./assets/btn_skill_water.png", btn_skill_ice: "./assets/btn_skill_ice.png", btn_skill_fire: "./assets/btn_skill_fire.png", btn_skill_void: "./assets/btn_skill_void.png", btn_skill_thunder: "./assets/btn_skill_thunder.png", btn_skill_holy: "./assets/btn_skill_holy.png",
            mob_bees: "./assets/mob_bees.png", mob_boar: "./assets/mob_boar.png", boss_dazhuang: "./assets/boss_dazhuang.png", mob_doubt: "./assets/mob_doubt.png", mob_lazy: "./assets/mob_lazy.png", boss_mirror: "./assets/boss_mirror.png", mob_rabbit: "./assets/mob_rabbit.png", mob_cloud: "./assets/mob_cloud.png", boss_sylphie: "./assets/boss_sylphie.png", mob_iceslime: "./assets/mob_iceslime.png", mob_snowbaby: "./assets/mob_snowbaby.png", boss_alpha: "./assets/boss_alpha.png", mob_firedrake: "./assets/mob_firedrake.png", mob_lavabeetle: "./assets/mob_lavabeetle.png", boss_agni: "./assets/boss_agni.png", mob_gargoyle: "./assets/mob_gargoyle.png", mob_shadowpriest: "./assets/mob_shadowpriest.png", boss_sophia: "./assets/boss_sophia.png", mob_voidhand: "./assets/mob_voidhand.png", mob_silence: "./assets/mob_silence.png", boss_lord_silence: "./assets/boss_lord_silence.png",
            item_shield: "./assets/item_shield.png", item_amulet_water: "./assets/item_amulet_water.png", item_boots_thunder: "./assets/item_boots_thunder.png", item_amulet_ice: "./assets/item_amulet_ice.png", item_staff_fire: "./assets/item_staff_fire.png", item_staff_holy: "./assets/item_staff_holy.png", item_ring_pandora: "./assets/item_ring_pandora.png",
            comic1: "./assets/comic1.jpg", comic2: "./assets/comic2.jpg", comic3: "./assets/comic3.jpg", comic4: "./assets/comic4.jpg", comic5: "./assets/comic5.jpg", comic6: "./assets/comic6.jpg", comic7: "./assets/comic7.jpg"
        };

        const ITEMS = [
            { id: 'village_shield', name: '守護者之盾 (強化)', img: ASSETS.item_shield, btnImg: ASSETS.btn_skill_shield, type: 'active', mpCost: 100, lore: '經過工匠精心強化的盾牌，表面流動著金色的光芒。現在能抵擋致命的攻擊。', obtain: '【我家門外】通關後 100% 獲得。', usage: '主動：獲得 150 點護盾。' },
            { id: 'water_amulet', name: '淨化水珠 (強化)', img: ASSETS.item_amulet_water, btnImg: ASSETS.btn_skill_water, type: 'active', mpCost: 100, lore: '吸收了月光精華的水珠，不僅能治癒傷口，還能洗滌一切負面狀態。', obtain: '【問心瀑布】機率掉落 (普通15%/困難30%)。', usage: '主動：回復 400 HP 並解除異常狀態。' },
            { id: 'thunder_boots', name: '閃電行者之靴 (強化)', img: ASSETS.item_boots_thunder, btnImg: ASSETS.btn_skill_thunder, type: 'passive', mpCost: 0, lore: '附魔了高階風魔法的靴子，穿上它，時間彷彿為你而靜止。', obtain: '【青青草原】機率掉落 (普通15%/困難30%)。', usage: '被動：每回合時間增加 12 秒。' },
            { id: 'ice_amulet', name: '絕對零度冰晶 (強化)', img: ASSETS.item_amulet_ice, btnImg: ASSETS.btn_skill_ice, type: 'active', mpCost: 100, lore: '連時間都能凍結的極寒冰晶。能讓最強大的敵人長時間無法動彈。', obtain: '【無痕冰川】機率掉落 (普通15%/困難30%)。', usage: '主動：令怪物攻擊 CD +5。' },
            { id: 'fire_staff', name: '滅世龍炎杖 (強化)', img: ASSETS.item_staff_fire, btnImg: ASSETS.btn_skill_fire, type: 'active', mpCost: 150, lore: '杖尖燃燒著來自地獄的黑炎，能瞬間將敵人化為灰燼。', obtain: '【火龍領地】機率掉落 (普通15%/困難30%)。', usage: '主動：下一次攻擊傷害 +150%。' },
            { id: 'holy_staff', name: '教皇權杖 (強化)', img: ASSETS.item_staff_holy, btnImg: ASSETS.btn_skill_holy, type: 'passive', mpCost: 0, lore: '象徵著至高無上權力的權杖，每一個母音都蘊含著神罰的力量。', obtain: '【試煉教堂】機率掉落 (普通15%/困難30%)。', usage: '被動：輸入母音傷害大幅增加 (+15)。' },
            { id: 'pandora_ring', name: '真理之戒 (強化)', img: ASSETS.item_ring_pandora, btnImg: ASSETS.btn_skill_void, type: 'active', mpCost: 200, lore: '洞悉世間真理的戒指。不僅能改寫現實，還能從虛空中汲取魔力。', obtain: '【最終決戰】機率掉落 (普通15%/困難30%)。', usage: '主動：秒殺單字並回復 50 MP。' },
        ];

        const LEVELS = [
            { id: 'home', name: '我家門外', minTopics: 1, waves: [{ name: '憤怒的蜜蜂', img: ASSETS.mob_bees, hp: 400, dmg: 100, exp: 30 }, { name: '憤怒的野豬', img: ASSETS.mob_boar, hp: 500, dmg: 120, exp: 30 }, { name: '守衛隊長．大壯', img: ASSETS.boss_dazhuang, hp: 1500, dmg: 180, isBoss: true, exp: 120 }], drop: 'village_shield', bg: ASSETS.bg_home, desc: "冒險的起點。", fieldEffect: "無" },
            { id: 'waterfall', name: '問心瀑布', minTopics: 2, waves: [{ name: '自卑(心魔)', img: ASSETS.mob_doubt, hp: 600, dmg: 130, exp: 50 }, { name: '懶惰(心魔)', img: ASSETS.mob_lazy, hp: 700, dmg: 140, exp: 50 }, { name: '鏡像小明', img: ASSETS.boss_mirror, hp: 2200, dmg: 200, isBoss: true, exp: 300 }], drop: 'water_amulet', bg: ASSETS.bg_waterfall, desc: "面對內心的恐懼。", fieldEffect: "濕滑地面：回合時間縮短" },
            { id: 'grassland', name: '青青草原', minTopics: 2, waves: [{ name: '疾風兔', img: ASSETS.mob_rabbit, hp: 800, dmg: 150, exp: 80 }, { name: '惡作劇雲朵', img: ASSETS.mob_cloud, hp: 900, dmg: 160, exp: 80 }, { name: '精靈射手．希爾微', img: ASSETS.boss_sylphie, hp: 3000, dmg: 240, isBoss: true, exp: 500 }], drop: 'thunder_boots', bg: ASSETS.bg_grass, desc: "小心那些快箭。", fieldEffect: "順風：敵人CD減少" },
            { id: 'glacier', name: '無痕冰川', minTopics: 3, waves: [{ name: '結冰史萊姆', img: ASSETS.mob_iceslime, hp: 1100, dmg: 180, exp: 150 }, { name: '雪怪寶寶', img: ASSETS.mob_snowbaby, hp: 1300, dmg: 200, exp: 150 }, { name: '冰封騎士．阿爾法', img: ASSETS.boss_alpha, hp: 4000, dmg: 300, isBoss: true, exp: 1000 }], drop: 'ice_amulet', bg: ASSETS.bg_ice, desc: "寒冷會凍結時間。", fieldEffect: "暴風雪：視線模糊" },
            { id: 'dragon', name: '火龍領地', minTopics: 3, waves: [{ name: '噴火小龍', img: ASSETS.mob_firedrake, hp: 1500, dmg: 220, exp: 250 }, { name: '熔岩甲蟲', img: ASSETS.mob_lavabeetle, hp: 1700, dmg: 240, exp: 250 }, { name: '古龍．阿格尼', img: ASSETS.boss_agni, hp: 5000, dmg: 350, isBoss: true, exp: 2000 }], drop: 'fire_staff', bg: ASSETS.bg_fire, desc: "燃燒殆盡吧！", fieldEffect: "灼熱：每回合扣血" },

            { id: 'final', name: '最終決戰', minTopics: 5, waves: [{ name: '虛空之手', img: ASSETS.mob_voidhand, hp: 3000, dmg: 300, exp: 800 }, { name: '沉默陰影', img: ASSETS.mob_silence, hp: 3500, dmg: 320, exp: 800 }, { name: '沉默之主．虛無', img: ASSETS.boss_lord_silence, hp: 10000, dmg: 500, isBoss: true, exp: 10000 }], drop: 'pandora_ring', bg: ASSETS.bg_final, desc: "語言的存亡之戰。", fieldEffect: "虛空：隨機封鎖技能" },
        ];

                healPopup: null, expPopup: null, messagePopup: null, skillActive: false, 
                bossPhase: 0, isSilenced: false, specialComboText: null 
            });
            
            const [calcState, setCalcState] = useState({ step: 0, base: 0, comboPct: 0, topicPct: 0, skillPct: 0, total: 0, triggerBase: 0, triggerCombo: 0, triggerSkill: 0 });
            const [processingTurn, setProcessingTurn] = useState(false); 

            const [inputState, setInputState] = useState({ queue: [], currentIndex: 0, currentInput: '', started: false });
            const [timer, setTimer] = useState({ val: 30, max: 30, active: false });
            const [startTime, setStartTime] = useState(0);

            const [curfewState, setCurfewState] = useState(null); 
            const [adminBypass, setAdminBypass] = useState(false);
            const [titleClickCount, setTitleClickCount] = useState(0);

            const triggerShake = () => { setIsShaking(true); setTimeout(() => setIsShaking(false), 300); };
            
            const spawnParticles = (count, x, y, color = "#fbbf24", type = 'normal', targetX, targetY) => {
                const newP = Array.from({ length: count }).map(() => ({ id: Math.random(), x, y, color, type, targetX, targetY }));
                setParticles(prev => [...prev, ...newP]);
                setTimeout(() => setParticles(prev => prev.filter(p => !newP.find(np => np.id === p.id))), 1500);
            };

            // 數據持久化：從 localStorage 加載
            useEffect(() => { 
                const saved = localStorage.getItem('spelling_rpg_v3_final_persistent'); 
                if (saved) setPlayer(p => ({ ...p, ...JSON.parse(saved) })); 
            }, []);

            // 數據持久化：保存到 localStorage
            useEffect(() => { 
                localStorage.setItem('spelling_rpg_v3_final_persistent', JSON.stringify(player)); 
            }, [player]);

            useEffect(() => {
                const checkTime = () => {
                    if (adminBypass) { setCurfewState(null); return; }
                    const now = new Date(); const day = now.getDay(); const h = now.getHours();
                    const isSchoolTime = (day >= 1 && day <= 5) && (h >= 8 && h < 15);
                    const isSleepTime = (h >= 22 || h < 6);
                    if (isSchoolTime) setCurfewState('SCHOOL'); else if (isSleepTime) setCurfewState('SLEEP'); else setCurfewState(null);
                };
                checkTime(); const interval = setInterval(checkTime, 1000); return () => clearInterval(interval);
            }, [adminBypass]);

            const handleTitleClick = () => {
                const newCount = titleClickCount + 1; setTitleClickCount(newCount);
                if (newCount >= 5) {
                    const pwd = prompt("請輸入管理員密碼：");
                    if (pwd === "BPEC27112066") { setAdminBypass(true); alert("健康系統已解除限制。"); }
                    setTitleClickCount(0);
                }
            };

            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'hidden') Object.values(bgm).forEach(b => b.pause());
                    else if (!bgmMuted) {
                        if (gameState === 'BATTLE') (levelInfo.id === 'final' ? bgm.final : bgm.battle).play().catch(()=>{});
                        else if (gameState !== 'RESULT') bgm.start.play().catch(()=>{});
                    }
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
            }, [bgmMuted, gameState, levelInfo.id]);

            useEffect(() => {
                if (bgmMuted) Object.values(bgm).forEach(b => b.pause()); 
                else {
                    if (['START', 'HOME', 'MAP', 'SYLLABUS', 'RESULT'].includes(gameState)) {
                        bgm.battle.pause(); bgm.final.pause(); bgm.start.play().catch(()=>{});
                    } else if (gameState === 'BATTLE') {
                        bgm.start.pause(); (levelInfo.id === 'final' ? bgm.final : bgm.battle).play().catch(()=>{});
                    }
                }
            }, [bgmMuted, gameState, levelInfo.id]);

            useEffect(() => {
                let interval = null;
                if (gameState === 'BATTLE' && timer.active && timer.val > 0) {
                    interval = setInterval(() => setTimer(curr => ({ ...curr, val: Math.max(0, curr.val - 1) })), 1000);
                } else if (gameState === 'BATTLE' && timer.active && timer.val === 0) endInputPhase();
                return () => clearInterval(interval);
            }, [gameState, timer.active, timer.val]);

            useEffect(() => {
                if (gameState === 'BATTLE' && battle.playerHp <= 0) {
                    playSfx('failed'); setResult({ win: false, time: Math.floor((Date.now() - startTime) / 1000) }); setGameState('RESULT');
                }
            }, [battle.playerHp, gameState]);

            useEffect(() => {
                if (gameState === 'BATTLE' && battle.phase === 'CALCULATION') {
                    const steps = [
                        () => setCalcState(s => ({ ...s, step: 1 })),
                        () => setCalcState(s => ({ ...s, step: 2 })),
                        () => setCalcState(s => ({ ...s, step: 3 })),
                        () => setCalcState(s => ({ ...s, step: 4 })),
                        () => setCalcState(s => ({ ...s, step: 5 })),
                        () => applyDamageAndNextTurn()
                    ];
                    steps.forEach((fn, idx) => setTimeout(fn, idx * 500));
                }
            }, [battle.phase]);

            const playSfx = (n, pitchShift = false) => { 
                if (!sfxMuted && sfx[n]) { 
                    const audio = sfx[n].cloneNode();
                    if (pitchShift) { audio.playbackRate = Math.min(1.5, 1 + (battle.combo * 0.05)); }
                    audio.volume = 1.0; audio.play().catch(() => {}); 
                } 
            };
            
            const stopAllBgm = () => Object.values(bgm).forEach(b => b.pause());
            const speak = (t, r = 1.0) => { 
                if (sfxMuted) return;
                const synth = window.speechSynthesis; const utter = new SpeechSynthesisUtterance(t); 
                utter.lang = 'en-US'; utter.rate = r; utter.volume = 1.0; synth.speak(utter); 
            };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); setIsFullscreen(true); }
                else { if (document.exitFullscreen) { document.exitFullscreen(); setIsFullscreen(false); } }
            };

            const initBattle = () => {
                const lvl = LEVELS.find(l => l.id === levelInfo.id);
                if (player.selectedTopics.length < lvl.minTopics) { alert(`至少需要選擇 ${lvl.minTopics} 個課題！`); return; }
                stopAllBgm(); playSfx('entermission');
                
                setTimeout(() => {
                    const hpMult = levelInfo.difficulty === 'hard' ? 2.0 : 1.0;
                    let startCd = (levelInfo.difficulty === 'hard' && levelInfo.id === 'grassland') ? 1 : 2;
                    let q = []; player.selectedTopics.forEach(t => { if(WORDS_DB[player.grade][t]) q = q.concat(WORDS_DB[player.grade][t]); });
                    q = shuffleArray(q.length ? q : [{en: "apple", zh: "蘋果"}]);
                    
                    const mob = lvl.waves[0];
                    // 等級加成計算
                    const maxHp = 1000 + (player.level - 1) * 50;
                    const maxMp = 200 + (player.level - 1) * 10;
                    const startShield = player.level >= 10 ? 150 : 0;

                    setBattle({ 
                        playerHp: maxHp, playerMaxHp: maxHp, playerMp: 0, playerMaxMp: maxMp, shield: startShield, 
                        waveIndex: 0, currentEnemy: mob, enemyHp: mob.hp * hpMult, enemyMaxHp: mob.hp * hpMult, 
                        enemyCd: startCd, enemyMaxCd: 2, phase: 'TACTICAL', combo: 0, rawScore: 0, selectedMode: null, 
                        skillConfirming: false, finalDamage: 0, damagePopup: null, playerDamagePopup: null, 
                        healPopup: null, expPopup: null, messagePopup: "戰鬥開始！", skillActive: false, 
                        bossPhase: 0, isSilenced: false, specialComboText: null 
                    });
                    setInputState({ queue: q, currentIndex: 0, currentInput: '', started: false });
                    setTimer({ val: 30, max: 30, active: false }); setStartTime(Date.now()); setGameState('BATTLE');
                    setProcessingTurn(false);
                    const topicBonusPct = player.selectedTopics.length > lvl.minTopics ? (player.selectedTopics.length - lvl.minTopics) * 7 : 0;
                    setCalcState({ step: 0, base: 0, comboPct: 0, topicPct: topicBonusPct, skillPct: 0, total: 0, triggerBase: 0, triggerCombo: 0, triggerSkill: 0 });
                    setTimeout(() => setBattle(b => ({ ...b, messagePopup: null })), 1500);
                }, 2000);
            };

            const handleKeyPress = useCallback((key) => {
                if (lockInput) return;

                // 處理 Space 鍵啟動計時器
                if (key === ' ' && battle.phase === 'TACTICAL' && battle.selectedMode) {
                    startInputPhase();
                    return;
                }

                if ((timer.val <= 0 && battle.phase === 'INPUT')) return;
                const char = key.toLowerCase(); if (!/[a-z]/.test(char)) return;
                
                setBattle(cur => {
                    if (cur.phase !== 'INPUT') return cur;
                    
                    setInputState(s => {
                        const target = s.queue[s.currentIndex].en; let temp = s.currentInput; let nextIdx = temp.length;
                        const skip = (idx) => { let i = idx; while (i < target.length && /[^a-zA-Z]/.test(target[i])) { temp += target[i]; i++; } return i; };
                        nextIdx = skip(nextIdx);

                        if (nextIdx < target.length && target[nextIdx].toLowerCase() === char) {
                            playSfx('click', true);
                            spawnParticles(3, 240, 400, "#ffffff");
                            temp += target[nextIdx];
                            
                            let letterScore = 10;
                            if (player.equippedItem === 'holy_staff' && 'aeiouAEIOU'.includes(target[nextIdx])) letterScore += 15;
                            // Lv 20 被動
                            if (player.level >= 20 && 'aeiouAEIOU'.includes(target[nextIdx])) letterScore += 10;

                            // Lv 5 被動
                            const mpGain = 1 + (player.level >= 5 ? 2 : 0);
                            setBattle(b => ({ ...b, playerMp: Math.min(b.playerMaxMp, b.playerMp + mpGain), rawScore: b.rawScore + letterScore }));
                            setCalcState(prev => ({ ...prev, base: prev.base + letterScore, triggerBase: prev.triggerBase + 1 }));

                            nextIdx = skip(nextIdx + 1);
                            if (temp.length >= target.length) {
                                playSfx('success'); triggerShake(); spawnParticles(15, 240, 400, "#fbbf24");
                                
                                // Lv 25 被動：生命福音
                                if (player.level >= 25) {
                                    setBattle(b => ({ ...b, playerHp: Math.min(b.playerMaxHp, b.playerHp + 30), healPopup: 30 }));
                                    setTimeout(() => setBattle(b => ({ ...b, healPopup: null })), 800);
                                }

                                const isLongWord = target.length >= 12; const comboGain = isLongWord ? 3 : 1;
                                setBattle(b => ({ ...b, rawScore: b.rawScore + 10, combo: b.combo + comboGain, specialComboText: isLongWord ? "特長詞語 +3 COMBO！！！" : null }));
                                setCalcState(prev => {
                                    const newCombo = cur.combo + comboGain;
                                    const comboBonusPct = newCombo > 0 ? newCombo * (cur.selectedMode === 'A' ? 10 : 5) : 0;
                                    return { ...prev, base: prev.base + 10, comboPct: comboBonusPct, triggerCombo: prev.triggerCombo + 1, triggerBase: prev.triggerBase + 1 };
                                });
                                if (isLongWord) setTimeout(() => setBattle(b => ({...b, specialComboText: null})), 1000);
                                if (cur.selectedMode === 'B') { setLockInput(true); setTimeout(() => speak(target, 0.9), 0); setTimeout(() => setLockInput(false), 800); }
                                else speak(target, 1.1); 
                                return { ...s, currentInput: '', currentIndex: (s.currentIndex + 1) % s.queue.length, started: false };
                            }
                            return { ...s, currentInput: temp, started: true };
                        }
                        return s;
                    });
                    return cur;
                });
            }, [player, lockInput, timer.val, battle.phase, battle.combo, battle.selectedMode]);

            useEffect(() => { const fn = (e) => handleKeyPress(e.key); window.addEventListener('keydown', fn); return () => window.removeEventListener('keydown', fn); }, [handleKeyPress]);

            const startInputPhase = () => { 
                let time = 30 + (player.equippedItem === 'thunder_boots' ? 12 : 0) + (player.level >= 15 ? 6 : 0);
                if (levelInfo.difficulty === 'hard' && levelInfo.id === 'waterfall') time -= 5;
                let silenced = (levelInfo.difficulty === 'hard' && levelInfo.id === 'final' && Math.random() < 0.5);
                if (silenced) { setBattle(b => ({...b, messagePopup: "虛空封鎖！技能失效！"})); setTimeout(() => setBattle(b => ({...b, messagePopup: null})), 1500); }
                setTimer({ val: time, max: time, active: true }); 
                setBattle(b => ({ ...b, phase: 'INPUT', rawScore: 0, combo: 0, isSilenced: silenced, specialComboText: null })); 
                const topicBonusPct = player.selectedTopics.length > LEVELS.find(l=>l.id===levelInfo.id).minTopics ? (player.selectedTopics.length - LEVELS.find(l=>l.id===levelInfo.id).minTopics) * 7 : 0;
                setCalcState({ step: 0, base: 0, comboPct: 0, topicPct: topicBonusPct, skillPct: 0, total: 0, triggerBase: 0, triggerCombo: 0, triggerSkill: 0 });
                setProcessingTurn(false);
            };

            const endInputPhase = () => {
                if (processingTurn) return; setProcessingTurn(true);
                setTimer(t => ({ ...t, active: false, val: 0 })); setLockInput(true); 
                setInputState(prev => ({ ...prev, currentInput: '', started: false }));
                
                // Lv 30 被動加成
                const lv30Bonus = player.level >= 30 ? 1.2 : 1.0;
                const finalDmg = Math.floor(calcState.base * (1 + (calcState.comboPct/100) + (calcState.topicPct/100) + (calcState.skillPct/100)) * lv30Bonus);
                
                setCalcState(prev => ({ ...prev, total: finalDmg })); setBattle(b => ({ ...b, phase: 'CALCULATION' }));
            };

            const addExp = (amount) => {
                setPlayer(p => {
                    let newExp = p.exp + amount;
                    let newLvl = p.level;
                    while (newExp >= getExpNeeded(newLvl) && newLvl < 30) {
                        newExp -= getExpNeeded(newLvl);
                        newLvl++;
                    }
                    return { ...p, level: newLvl, exp: newExp };
                });
            };

            const applyDamageAndNextTurn = () => {
                setBattle(prev => {
                    const dmg = calcState.total; playSfx('hit');
                    spawnParticles(20, 350, 150, "#ef4444"); 
                    
                    setTimeout(() => {
                        setBattle(b => {
                            if (b.enemyHp <= 0) {
                                const lvlData = LEVELS.find(l => l.id === levelInfo.id);
                                
                                // 經驗值獲得與粒子流向主角 (100, 450)
                                const gainedExp = Math.floor(b.currentEnemy.exp * (levelInfo.difficulty === 'hard' ? 1.5 : 1.0));
                                spawnParticles(10, 350, 150, "#7CFC00", 'exp', 100, 450);
                                addExp(gainedExp);

                                if (b.waveIndex < lvlData.waves.length - 1) {
                                    const nextMob = lvlData.waves[b.waveIndex + 1];
                                    const hMult = levelInfo.difficulty === 'hard' ? 2.0 : 1.0;
                                    
                                    setTimeout(() => {
                                        setLockInput(false);
                                        setProcessingTurn(false);
                                        setInputState(s => ({...s, started: false, currentInput: ''}));
                                        setTimeout(() => setBattle(bb => ({ ...bb, messagePopup: null })), 1500);
                                    }, 0);

                                    return { ...b, waveIndex: b.waveIndex + 1, currentEnemy: nextMob, enemyHp: nextMob.hp * hMult, enemyMaxHp: nextMob.hp * hMult, enemyCd: 2, phase: 'TACTICAL', selectedMode: null, messagePopup: "下一波！", damagePopup: null, expPopup: gainedExp, skillActive: false, bossPhase: 0, isSilenced: false };
                                } else { 
                                    playSfx('victory'); 
                                    if (lvlData.drop && !player.inventory.includes(lvlData.drop)) {
                                        if (Math.random() < (lvlData.id === 'home' ? 1.0 : (levelInfo.difficulty === 'hard' ? 0.3 : 0.15))) {
                                            setPlayer(p => ({...p, inventory: [...p.inventory, lvlData.drop]})); alert(`獲得裝備：${ITEMS.find(i=>i.id===lvlData.drop).name}！`);
                                        }
                                    }
                                    const nextIdx = LEVELS.findIndex(l => l.id === lvlData.id) + 1;
                                    if (nextIdx < LEVELS.length && !player.unlockedLevels.includes(LEVELS[nextIdx].id)) setPlayer(p => ({...p, unlockedLevels: [...p.unlockedLevels, LEVELS[nextIdx].id]}));
                                    if (!player.unlockedStories.includes(lvlData.id)) setPlayer(p => ({ ...p, unlockedStories: [...p.unlockedStories, lvlData.id], hasNewStory: true }));
                                    setResult({ win: true, time: Math.floor((Date.now() - startTime) / 1000) }); setGameState('RESULT'); return b; 
                                }
                            }
                            
                            let next = { ...b, damagePopup: null, skillActive: false }; 
                            if (levelInfo.difficulty === 'hard' && levelInfo.id === 'dragon') { next.playerHp = Math.max(0, next.playerHp - 50); next.playerDamagePopup = 50; }
                            
                            if (next.enemyCd <= 1) {
                                triggerShake(); spawnParticles(15, 100, 450, "#a855f7");
                                let rawDmg = (levelInfo.difficulty === 'hard' ? Math.floor(next.currentEnemy.dmg * 1.25) : next.currentEnemy.dmg);
                                if (next.currentEnemy.isBoss) { if (next.bossPhase % 2 !== 0) rawDmg = Math.floor(rawDmg * 1.5); next.bossPhase++; next.enemyCd = 1; }
                                else next.enemyCd = 2;
                                playSfx('hurt');
                                if (next.shield > 0) { const abs = Math.min(next.shield, rawDmg); next.shield -= abs; rawDmg -= abs; }
                                next.playerHp = Math.max(0, next.playerHp - rawDmg); next.playerDamagePopup = rawDmg;
                            } else next.enemyCd--;

                            setTimeout(() => {
                                setLockInput(false);
                                setProcessingTurn(false);
                                setBattle(bb => ({...bb, playerDamagePopup: null, messagePopup: null, expPopup: null}));
                            }, 1000);

                            return { ...next, phase: 'TACTICAL', selectedMode: null };
                        });
                    }, 1000);
                    return { ...prev, enemyHp: Math.max(0, prev.enemyHp - dmg), damagePopup: dmg > 0 ? dmg : null };
                });
            };

            const handleSkill = () => {
                if (battle.isSilenced || !player.equippedItem) return;
                const item = ITEMS.find(i => i.id === player.equippedItem);
                if (item.type === 'passive' || battle.playerMp < item.mpCost) return;
                if (!battle.skillConfirming) setBattle({ ...battle, skillConfirming: true });
                else {
                    playSfx('skill'); triggerShake(); spawnParticles(25, 240, 300, "#6366f1");
                    const isChurchHard = levelInfo.difficulty === 'hard' && levelInfo.id === 'church';
                    if (item.id === 'village_shield') setBattle(b => ({ ...b, shield: isChurchHard ? b.shield : b.shield + 150, playerMp: b.playerMp - 100, skillConfirming: false, messagePopup: isChurchHard ? "聖光無效！" : null }));
                    if (item.id === 'water_amulet') setBattle(b => ({ ...b, playerHp: Math.min(b.playerMaxHp, b.playerHp + (isChurchHard ? 200 : 400)), playerMp: b.playerMp - 100, skillConfirming: false, healPopup: (isChurchHard ? 200 : 400), isSilenced: false }));
                    if (item.id === 'ice_amulet') setBattle(b => ({ ...b, enemyCd: b.enemyCd + 5, playerMp: b.playerMp - 100, skillConfirming: false }));
                    if (item.id === 'fire_staff') { setBattle(b => ({ ...b, skillActive: true, playerMp: b.playerMp - 150, skillConfirming: false })); setCalcState(prev => ({ ...prev, skillPct: 150, triggerSkill: prev.triggerSkill + 1 })); }
                    if (item.id === 'pandora_ring') { 
                        const target = inputState.queue[inputState.currentIndex].en; const wordScore = target.replace(/[^a-zA-Z]/g,'').length * 10 + 10;
                        setBattle(b => ({ ...b, rawScore: b.rawScore + wordScore, combo: b.combo + 1, playerMp: Math.min(b.playerMaxMp, b.playerMp - 150), skillConfirming: false }));
                        setCalcState(prev => ({ ...prev, base: prev.base + wordScore, comboPct: (battle.combo+1)*(battle.selectedMode==='A'?10:5), triggerBase: prev.triggerBase + 1, triggerCombo: prev.triggerCombo + 1 }));
                        setInputState(s => ({ ...s, currentInput: '', currentIndex: (s.currentIndex + 1) % s.queue.length }));
                    }
                    setTimeout(() => setBattle(bb => ({...bb, healPopup: null, messagePopup: null})), 1000);
                }
            };

            const renderInputHint = () => {
                const target = inputState.queue[inputState.currentIndex]?.en || "";
                const blurClass = (levelInfo.difficulty === 'hard' && levelInfo.id === 'glacier') ? 'blizzard-blur' : '';
                const showFullWord = inputState.started && battle.selectedMode === 'B';

                return (
                    <div className={`flex flex-wrap justify-center font-mono ${blurClass}`}>
                        {target.split('').map((c, i) => {
                            const isTyped = i < inputState.currentInput.length;
                            const isSymbol = /[^a-zA-Z]/.test(c);
                            const isLastTyped = isTyped && i === inputState.currentInput.length - 1;
                            return (
                                <div key={i} className={`char-box ${isTyped ? 'text-yellow-400' : 'text-slate-600'} ${isLastTyped ? 'char-typed-zoom' : ''}`}>
                                    {isTyped || isSymbol || showFullWord || i === 0 ? c : '_'}
                                </div>
                            );
                        })}
                    </div>
                );
            };

            return (
                <div className="game-container">
                    <div className={`game-frame ${isShaking ? 'shake-active' : ''}`}>
                        {particles.map(p => <Particle key={p.id} {...p} />)}
                        {curfewState && (
                            <div className="curfew-overlay">
                                <div onClick={handleTitleClick} className="text-6xl mb-4 cursor-pointer active:scale-90 transition-transform">{curfewState === 'SCHOOL' ? '🏫' : '🛌'}</div>
                                <h2 className="text-2xl font-bold text-yellow-500 mb-2">{curfewState === 'SCHOOL' ? '專心上課' : '睡覺晚安'}</h2>
                                <p className="text-lg text-slate-300">{curfewState === 'SCHOOL' ? '❤️放學再玩' : '❤️瑪卡巴卡'}</p>
                            </div>
                        )}

                        <div className="absolute top-4 right-4 z-50 flex gap-2">
                            <button onClick={toggleFullscreen} className="p-2 bg-black/40 rounded-full text-white border border-white/20">{isFullscreen ? <Icons.Minimize size={18}/> : <Icons.Maximize size={18}/>}</button>
                            <button onClick={() => setBgmMuted(!bgmMuted)} className={`p-2 rounded-full border ${bgmMuted ? 'bg-red-900/80 border-red-500 text-red-200' : 'bg-black/40 border-white/20 text-white'}`}>{bgmMuted ? '🔇' : <Icons.Music size={18}/>}</button>
                            <button onClick={() => setSfxMuted(!sfxMuted)} className={`p-2 rounded-full border ${sfxMuted ? 'bg-red-900/80 border-red-500 text-red-200' : 'bg-black/40 border-white/20 text-white'}`}>{sfxMuted ? '🔇' : '🔊'}</button>
                            <button onClick={() => { if(gameState==='BATTLE') setHomeConfirm(true); else { stopAllBgm(); setGameState('START'); } }} className="p-2 bg-black/40 rounded-full text-white border border-white/20"><Icons.HomeIcon size={18}/></button>
                        </div>

                        <AnimatePresence>
                            {homeConfirm && (
                                <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md">
                                    <div className="rpg-panel p-8 rounded-xl text-center border-2 border-yellow-600">
                                        <h3 className="text-xl text-yellow-500 font-bold mb-6">放棄戰鬥？</h3>
                                        <div className="flex gap-4"><button onClick={()=>{setHomeConfirm(false); stopAllBgm(); setGameState('START');}} className="flex-1 py-3 bg-red-900 text-white rounded-lg font-bold">是</button><button onClick={()=>setHomeConfirm(false)} className="flex-1 py-3 bg-slate-700 text-white rounded-lg font-bold">否</button></div>
                                    </div>
                                </div>
                            )}
                        </AnimatePresence>

                        {gameState === 'START' && (
                            <div className="h-full relative flex flex-col items-center justify-center p-8 text-center overflow-hidden">
                                <motion.div className="absolute -inset-1 bg-cover bg-center scale-105" style={{backgroundImage: `url(${ASSETS.bg_start})`, backgroundColor: '#1e293b' }} />
                                <div className="absolute inset-0 bg-black/40"></div>
                                <motion.div initial={{ y: -50, opacity: 0 }} animate={{ y: 0, opacity: 1 }} className="z-10">
                                    <h1 className="text-5xl font-black text-yellow-500 mb-2 font-rpg tracking-widest">聖言傳說</h1>
                                    <p className="text-slate-300 mb-8 italic">「專屬於學習的異世界轉生」</p>
                                    <div className="flex items-center justify-center gap-2 text-emerald-400 mb-12 text-sm font-bold bg-black/50 py-2 px-4 rounded-full border border-emerald-500/30">
                                        <Icons.Keyboard size={16} /> <span>提示：支持電腦實體鍵盤操作</span>
                                    </div>
                                    <button onClick={() => setGameState('HOME')} className="rpg-button px-12 py-4 rounded-full font-bold text-xl">開始冒險</button>
                                </motion.div>
                            </div>
                        )}

                        {gameState === 'HOME' && (
                            <div className="h-full bg-slate-900 text-slate-100 p-6 overflow-y-auto pt-16">
                                <div className="flex items-center gap-4 mb-6">
                                    <div className="w-16 h-16 bg-yellow-600 rounded-full border-2 border-yellow-400 flex items-center justify-center text-2xl font-black text-white">
                                        {player.level}
                                    </div>
                                    <div className="flex-1">
                                        <div className="flex justify-between items-end mb-1">
                                            <span className="text-yellow-500 font-bold font-rpg">LEVEL {player.level}</span>
                                            <span className="text-xs text-slate-400">{player.exp} / {getExpNeeded(player.level)} EXP</span>
                                        </div>
                                        <div className="w-full h-3 bg-slate-800 rounded-full border border-slate-700 overflow-hidden">
                                            <motion.div className="h-full bg-yellow-500" initial={{width: 0}} animate={{width: `${(player.exp/getExpNeeded(player.level))*100}%`}} />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-2 mb-6">
                                    <button onClick={() => setGameState('MAP')} className="flex-1 py-4 rpg-button rounded-xl font-bold text-lg flex items-center justify-center gap-2"><Icons.MapIcon /> 前往地圖</button>
                                    <button onClick={() => { if(player.unlockedStories.length) setViewingStory(player.unlockedStories[player.unlockedStories.length-1]); setPlayer(p=>({...p, hasNewStory:false})); }} className="relative flex-1 py-4 bg-slate-700 border-2 border-slate-500 rounded-xl font-bold text-lg flex items-center justify-center gap-2 text-slate-300">
                                        <Icons.Book /> 故事集 {player.hasNewStory && <span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full new-badge">NEW</span>}
                                    </button>
                                </div>

                                <div className="mb-6 p-4 rpg-panel rounded-lg border border-slate-700">
                                    <h3 className="text-sm font-bold text-sky-400 mb-3 flex items-center gap-2"><Icons.Star size={14}/> 當前等級加成</h3>
                                    <div className="grid grid-cols-2 gap-y-2 text-xs">
                                        <div className="text-slate-300">最大生命值: <span className="text-emerald-400">+{ (player.level-1)*50 }</span></div>
                                        <div className="text-slate-300">最大魔力值: <span className="text-blue-400">+{ (player.level-1)*10 }</span></div>
                                        <div className="text-slate-300">傷害加成: <span className="text-red-400">+{ (player.level-1)*2 }%</span></div>
                                        <div className="text-slate-300">解鎖被動: <span className="text-yellow-400">{ Math.floor(player.level/5) } 個</span></div>
                                    </div>
                                </div>

                                <div className="mb-6 p-4 rpg-panel rounded-lg border border-slate-700 min-h-[120px]">
                                    {selectedItemInfo ? (
                                        <div><div className="text-yellow-500 font-bold text-lg mb-1">{selectedItemInfo.name}</div><div className="text-xs text-slate-300 mb-2 leading-relaxed">{selectedItemInfo.lore}</div><div className="text-xs text-sky-400 font-bold mb-1">取得：{selectedItemInfo.obtain}</div><div className="text-xs text-emerald-400 font-bold">{selectedItemInfo.usage}</div></div>
                                    ) : <div className="text-sm text-slate-400 italic">{player.storyDesc}</div>}
                                </div>

                                <div className="grid grid-cols-4 gap-3">
                                    {ITEMS.map(item => { 
                                        const isOwned = player.inventory.includes(item.id); const isEquipped = player.equippedItem === item.id; 
                                        return (
                                            <button key={item.id} onClick={() => { setSelectedItemInfo(item); if(isOwned) setPlayer({...player, equippedItem: isEquipped ? null : item.id}); }} className={`aspect-square rounded-lg border-2 flex items-center justify-center p-2 relative overflow-hidden ${isOwned ? (isEquipped ? 'border-yellow-400 bg-yellow-900/40' : 'border-yellow-600 bg-slate-800') : 'border-slate-800 bg-slate-900'}`}>
                                                <img src={item.img} className={`w-full h-full object-contain ${!isOwned ? 'locked-silhouette' : ''}`} />
                                                {!isOwned && <div className="absolute inset-0 flex items-center justify-center"><Icons.Lock size={12} className="text-slate-500"/></div>}
                                            </button>
                                        ); 
                                    })}
                                </div>
                            </div>
                        )}

                        {gameState === 'MAP' && (
                            <div className="h-full p-6 flex flex-col pt-16" style={{ backgroundImage: `url(${ASSETS.bg_map})`, backgroundSize: 'cover' }}>
                                <div className="absolute inset-0 bg-black/60"></div>
                                <div className="relative z-10 h-full flex flex-col">
                                    <h2 className="text-2xl font-bold text-yellow-500 font-rpg mb-8">世界地圖</h2>
                                    <div className="flex-1 space-y-4 overflow-y-auto">
                                        {LEVELS.map(lvl => {
                                            const isUnlocked = player.unlockedLevels.includes(lvl.id); const isSelected = levelInfo.id === lvl.id;
                                            return (
                                                <div key={lvl.id} onClick={() => isUnlocked && setLevelInfo({...levelInfo, id: lvl.id})} className={`p-4 rounded-xl border-2 transition-all relative overflow-hidden ${isUnlocked ? (isSelected ? 'border-yellow-500' : 'border-slate-500') : 'border-slate-800'}`} style={{ backgroundImage: `url(${lvl.bg})`, backgroundSize: 'cover' }}>
                                                    <div className="absolute inset-0 bg-black/50"></div>
                                                    {!isUnlocked && <div className="absolute inset-0 bg-black/70 flex flex-col items-center justify-center z-20"><Icons.Lock size={32} className="text-slate-400 mb-2"/><span className="text-xs text-slate-300 font-bold">需通關前置關卡</span></div>}
                                                    <div className="relative z-10"><h3 className="font-bold text-lg text-yellow-400">{lvl.name}</h3><p className="text-xs text-slate-300">{lvl.desc}</p>
                                                        {isSelected && isUnlocked && (
                                                            <motion.div initial={{ height: 0 }} animate={{ height: 'auto' }} className="mt-4 pt-4 border-t border-slate-700">
                                                                <div className="flex gap-2 mb-4"><button onClick={(e)=>{e.stopPropagation(); setLevelInfo({...levelInfo, difficulty:'normal'})}} className={`flex-1 py-2 rounded text-xs ${levelInfo.difficulty==='normal'?'bg-emerald-600':'bg-slate-700'}`}>普通</button>{lvl.id !== 'home' && <button onClick={(e)=>{e.stopPropagation(); setLevelInfo({...levelInfo, difficulty:'hard'})}} className={`flex-1 py-2 rounded text-xs ${levelInfo.difficulty==='hard'?'bg-red-700':'bg-slate-700'}`}>困難</button>}</div>
                                                                <button onClick={()=>setGameState('SYLLABUS')} className="w-full py-3 rpg-button rounded font-bold">選擇課題</button>
                                                            </motion.div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {gameState === 'SYLLABUS' && (
                            <div className="h-full bg-slate-900 p-6 flex flex-col pt-16">
                                <h2 className="text-2xl font-bold text-yellow-500 mb-4 font-rpg text-center">選擇課題</h2>
                                <div className="flex gap-2 mb-6">{['P.3', 'P.4', 'P.5', 'P.6'].map(g => (<button key={g} onClick={() => setPlayer({...player, grade: g, selectedTopics: []})} className={`flex-1 py-2 rounded font-bold border ${player.grade === g ? 'bg-yellow-600 border-yellow-400' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>{g}</button>))}</div>
                                <div className="flex-1 overflow-y-auto space-y-2">
                                    {Object.keys(WORDS_DB[player.grade] || {}).map(t => {
                                        const isSelected = player.selectedTopics.includes(t);
                                        return (<button key={t} onClick={() => setPlayer({...player, selectedTopics: isSelected ? player.selectedTopics.filter(x=>x!==t) : [...player.selectedTopics, t]})} className={`w-full py-4 px-4 rounded border text-left font-bold text-sm flex justify-between items-center ${isSelected ? 'bg-sky-700 border-sky-400' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>{t}{isSelected && <span>✅</span>}</button>)
                                    })}
                                </div>
                                <div className="mt-4 p-3 bg-slate-950 rounded border border-slate-800 text-center">
                                    <span className="text-emerald-400 font-bold">當前範圍加成：+{player.selectedTopics.length > LEVELS.find(l=>l.id===levelInfo.id).minTopics ? (player.selectedTopics.length - LEVELS.find(l=>l.id===levelInfo.id).minTopics) * 7 : 0}%</span>
                                </div>
                                <button onClick={initBattle} className="mt-4 w-full py-4 rpg-button rounded-xl font-bold">開始戰鬥</button>
                            </div>
                        )}

                        {gameState === 'BATTLE' && (
                            <div className="h-full flex flex-col bg-black relative">
                                <AnimatePresence>{battle.messagePopup && (<motion.div initial={{ scale: 0 }} animate={{ scale: 1 }} exit={{ scale: 1.5, opacity: 0 }} className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"><h2 className="text-4xl font-black text-red-500 drop-shadow-lg text-center font-rpg">{battle.messagePopup}</h2></motion.div>)}</AnimatePresence>
                                <AnimatePresence>{battle.specialComboText && (<motion.div initial={{ y: 50, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: -50, opacity: 0 }} className="absolute top-1/4 left-0 right-0 z-50 flex items-center justify-center pointer-events-none"><h2 className="text-3xl rainbow-text text-center px-4">{battle.specialComboText}</h2></motion.div>)}</AnimatePresence>
                                
                                <div className="flex-1 relative overflow-hidden">
                                    <motion.div className="absolute -inset-1 bg-cover bg-center opacity-40 scale-105" style={{backgroundImage: `url(${LEVELS.find(l=>l.id===levelInfo.id).bg})`}} />
                                    <div className="absolute top-2 left-2 z-30 flex flex-col gap-0.5 pointer-events-none origin-top-left scale-90">
                                        <div className="text-white font-bold text-sm dmg-text">輸入傷害：<span key={calcState.triggerBase} className="dmg-pop">{calcState.base}</span></div>
                                        <div className="text-sm font-bold text-yellow-400 dmg-text">COMBO：+<span key={calcState.triggerCombo} className="dmg-pop">{calcState.comboPct}</span>%</div>
                                        <div className="text-sm font-bold text-emerald-400 dmg-text">範圍加成：+{calcState.topicPct}%</div>
                                        <div className="text-sm font-bold text-purple-400 dmg-text">技能加成：+<span key={calcState.triggerSkill} className="dmg-pop">{calcState.skillPct}</span>%</div>
                                        {calcState.step >= 5 && <div className="text-red-500 font-black text-3xl mt-1 dmg-text total-dmg-pop">合共傷害：{calcState.total}</div>}
                                    </div>

                                    <div className="absolute top-12 right-6 flex flex-col items-end w-40 z-10">
                                        <div className="text-white font-bold text-sm mb-1">{battle.currentEnemy?.name}</div>
                                        <div className="bg-slate-900/80 px-3 py-1 rounded border border-slate-700 text-xs text-red-400 font-bold mb-2">CD {battle.enemyCd}</div>
                                        <div className="w-full h-2 bg-slate-800 rounded-full border border-slate-700 mb-4"><motion.div className="h-full bg-red-600" animate={{ width: `${(battle.enemyHp/battle.enemyMaxHp)*100}%` }} /></div>
                                        <motion.div className="w-40 h-40 relative" animate={{y:[0,-5,0]}} transition={{duration:2, repeat:Infinity}}><img src={battle.currentEnemy?.img} className="w-full h-full object-contain scale-125 origin-bottom" /><AnimatePresence>{battle.damagePopup && (<motion.div initial={{ y: 0, opacity: 1, scale: 0.5 }} animate={{ y: -80, opacity: 0, scale: 1.5 }} className="absolute inset-0 flex items-center justify-center text-5xl font-black text-red-500 z-30">-{battle.damagePopup}</motion.div>)}</AnimatePresence></motion.div>
                                    </div>
                                    <div className="absolute bottom-12 left-6 w-32 z-10">
                                        <div className="w-24 h-24 relative mb-4">
                                            <img src={ASSETS.char_missionary} className="w-full h-full object-contain scale-125 origin-bottom" />
                                            <AnimatePresence>{battle.playerDamagePopup && (<motion.div initial={{ y: 0, opacity: 1 }} animate={{ y: -60, opacity: 0 }} className="absolute inset-0 flex items-center justify-center text-4xl font-black text-purple-500 z-30">-{battle.playerDamagePopup}</motion.div>)}</AnimatePresence>
                                            <AnimatePresence>{battle.healPopup && (<motion.div initial={{ y: 0, opacity: 1 }} animate={{ y: -60, opacity: 0 }} className="absolute inset-0 flex items-center justify-center text-4xl font-black text-emerald-400 z-30">+{battle.healPopup}</motion.div>)}</AnimatePresence>
                                            <AnimatePresence>{battle.expPopup && (<motion.div initial={{ y: 0, opacity: 1, scale: 0.5 }} animate={{ y: -100, opacity: 0, scale: 1.2 }} className="absolute inset-0 flex items-center justify-center text-3xl font-black text-yellow-400 z-40 drop-shadow-md">+{battle.expPopup} EXP</motion.div>)}</AnimatePresence>
                                        </div>
                                        <div className="w-full h-2.5 bg-slate-800 rounded-full border border-slate-700 mb-1 relative overflow-hidden"><motion.div className="h-full bg-emerald-500" animate={{ width: `${(battle.playerHp/battle.playerMaxHp)*100}%` }} />{battle.shield > 0 && <div className="absolute top-0 right-0 h-full bg-sky-400/50" style={{width: `${(battle.shield/battle.playerMaxHp)*100}%`}}></div>}</div>
                                        <div className="w-full h-1.5 bg-slate-800 rounded-full border border-slate-700"><motion.div className="h-full bg-blue-500" animate={{ width: `${(battle.playerMp/battle.playerMaxMp)*100}%` }} /></div>
                                    </div>
                                </div>

                                <div className="h-12 bg-slate-900 border-y border-slate-800 flex items-center justify-center gap-2 px-4 flex-shrink-0"><span className="text-yellow-500 font-bold text-lg">[{inputState.queue[inputState.currentIndex]?.zh}]</span></div>
                                <div className="h-2 bg-slate-950 flex-shrink-0"><motion.div className={`h-full ${timer.val < 10 ? 'bg-red-600' : 'bg-emerald-500'}`} animate={{ width: `${(timer.val/timer.max)*100}%` }} transition={{ease:"linear", duration: 1}} /></div>
                                
                                <div className="bg-slate-900 flex flex-col flex-shrink-0">
                                    <div className="flex justify-center gap-6 p-3">
                                        <button disabled={inputState.started} onClick={()=>setBattle({...battle, selectedMode: 'A'})} className={`tactic-btn ${battle.selectedMode === 'A' ? 'active' : ''}`}><img src={ASSETS.btn_tactic_a} /></button>
                                        <button disabled={inputState.started} onClick={()=>setBattle({...battle, selectedMode: 'B'})} className={`tactic-btn ${battle.selectedMode === 'B' ? 'active' : ''}`}><img src={ASSETS.btn_tactic_b} /></button>
                                        <button disabled={inputState.started || battle.isSilenced || !player.equippedItem || ITEMS.find(i=>i.id===player.equippedItem).type === 'passive'} onClick={handleSkill} className={`tactic-btn ${player.equippedItem && battle.playerMp >= ITEMS.find(i=>i.id===player.equippedItem).mpCost ? 'skill-ready-glow' : 'opacity-40'} ${battle.skillConfirming ? 'ring-4 ring-purple-400' : ''}`}>{player.equippedItem ? <img src={ITEMS.find(i=>i.id===player.equippedItem).btnImg} /> : <Icons.Lock className="m-auto text-slate-500"/>}</button>
                                    </div>
                                    <div className="word-display-area">
                                        {(battle.selectedMode && !timer.active && battle.phase === 'TACTICAL') && (
                                            <motion.button initial={{scale:0}} animate={{scale:1}} onClick={startInputPhase} className="px-10 py-3 bg-yellow-600 border-2 border-yellow-400 rounded-full text-white font-black text-xl shadow-lg active:scale-95">
                                                啟動聖言 (Space)
                                            </motion.button>
                                        )}
                                        {(battle.phase === 'INPUT') && renderInputHint()}
                                    </div>
                                    <div className="kbd-container">
                                        <div className="kbd-row">{'qwertyuiop'.split('').map(c => <button key={c} onMouseDown={(e)=>{e.preventDefault(); handleKeyPress(c)}} className="kbd-key">{c}</button>)}</div>
                                        <div className="kbd-row"><div className="row-2-spacer"></div>{'asdfghjkl'.split('').map(c => <button key={c} onMouseDown={(e)=>{e.preventDefault(); handleKeyPress(c)}} className="kbd-key">{c}</button>)}<div className="row-2-spacer"></div></div>
                                        <div className="kbd-row"><div className="row-3-spacer"></div>{'zxcvbnm'.split('').map(c => <button key={c} onMouseDown={(e)=>{e.preventDefault(); handleKeyPress(c)}} className="kbd-key">{c}</button>)}<div className="row-3-spacer" style={{width: '60px'}}></div></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {gameState === 'RESULT' && (
                            <div className="h-full bg-slate-950 flex flex-col items-center justify-center p-8 text-center">
                                <div className="text-8xl mb-8">{result.win ? '🏆' : '💀'}</div>
                                <h2 className="text-4xl font-black text-yellow-500 mb-4 font-rpg">{result.win ? 'VICTORY' : 'DEFEAT'}</h2>
                                <p className="text-slate-400 mb-8">Time: {result.time}s</p>
                                <button onClick={()=> setGameState('MAP')} className="rpg-button px-12 py-4 rounded-xl font-bold">返回地圖</button>
                            </div>
                        )}

                        <AnimatePresence>
                            {viewingStory && (
                                <div className="fixed inset-0 z-[100] bg-black/90 flex flex-col items-center justify-center p-4">
                                    <div className="w-full max-w-md bg-slate-900 border-2 border-yellow-600 rounded-xl overflow-hidden flex flex-col max-h-[90vh]">
                                        <div className="p-4 bg-slate-800 flex justify-between items-center border-b border-slate-700">
                                            <h3 className="text-xl font-bold text-yellow-500">{STORIES[viewingStory].title}</h3>
                                            <button onClick={() => setViewingStory(null)} className="text-slate-400 hover:text-white"><Icons.X /></button>
                                        </div>
                                        <div className="p-6 overflow-y-auto bg-slate-950 text-center">
                                            <img src={STORIES[viewingStory].image} className="w-full h-auto mb-6 rounded border border-slate-700" />
                                            <p className="text-slate-200 whitespace-pre-line leading-loose text-lg">{STORIES[viewingStory].content}</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </AnimatePresence>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpellingRPG />);
    </script>
</body>
</html>
